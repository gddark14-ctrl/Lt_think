<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>로또 AI 패턴 연구소 v5</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
<header>
<h1>🎯 로또 AI 패턴 연구소 <small>v5</small></h1>
<p>10만 패턴 탐색 · 시간순 검증 · 최종 테스트 · 랜덤 동일조건 비교</p>
</header>
<section class="panel">
<div class="buttons">
<button id="run">🚀 10만 패턴 자동탐색 + 전체 검증</button>
<button id="pick">🎯 최종 패턴으로 최신 10게임</button>
</div>
<div id="status">대기 중</div><div class="progress"><i id="bar"></i></div>
</section>
<section class="panel"><h2>📊 최종 검증 결과</h2><div id="stats"><div class="muted">분석을 시작하세요.</div></div></section>
<section class="panel"><h2>🔬 살아남은 패턴 TOP 10</h2><div id="patterns"></div></section>
<section class="panel"><h2>🎯 추천 10게임</h2><div id="picks"></div></section>
<section class="panel note"><b>주의</b><p>6개 적중률을 인위적으로 높이도록 최적화하지 않습니다. 훈련→검증→최종 테스트를 시간순으로 분리해 과적합을 확인합니다. 최종 테스트는 패턴 선택에 사용하지 않은 데이터입니다.</p></section>
</main>
<script src="app.js"></script>
</body>
</html>
